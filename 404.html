<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Страница не найдена — Ольга Быстрова</title>
  <link rel="icon" href="https://sokolovpashawork-dev.github.io/Svoboda-Dvijenia/favicon.svg" type="image/svg+xml">
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; padding: 24px; background: #f4f0f3; color: #1d1520; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; text-align: center; }
    main { max-width: 520px; }
    p.num { margin: 0; font: 700 clamp(5rem, 22vw, 9rem)/1 "Arial Narrow", Impact, sans-serif; color: transparent; -webkit-text-stroke: 2px #4f3270; }
    h1 { margin: 8px 0 12px; font-size: clamp(1.5rem, 5vw, 2rem); text-transform: uppercase; letter-spacing: .02em; }
    p { margin: 0 0 24px; line-height: 1.5; color: #655a68; }
    a { display: inline-block; padding: .9em 1.8em; background: #4f3270; color: #fff; text-decoration: none; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; font-size: .88rem; }
    a:hover, a:focus-visible { background: #382250; }
  </style>
</head>
<body>
  <main>
    <p class="num" aria-hidden="true">404</p>
    <h1>Страница не найдена</h1>
    <p>Возможно, ссылка устарела или в адресе опечатка. Вернитесь на главную страницу.</p>
    <a href="https://sokolovpashawork-dev.github.io/Svoboda-Dvijenia/">На главную</a>
  </main>
</body>
</html>
